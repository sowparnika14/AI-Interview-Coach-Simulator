    <script>
      // Gracefully handle and suppress harmless Vite HMR WebSocket connection errors in iframe
      window.addEventListener('error', function(event) {
        if (event && (
          event.message?.includes('WebSocket') ||
          event.message?.includes('createWebSocketModuleRunnerTransport') ||
          event.filename?.includes('@vite/client')
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        const msg = event?.reason?.message || '';
        const stack = event?.reason?.stack || '';
        if (msg.includes('WebSocket') || stack.includes('@vite/client') || stack.includes('createWebSocketModuleRunnerTransport')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
